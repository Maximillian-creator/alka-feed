name: Alka Feed Updater

on:
  schedule:
    # 2x per dag (05:20 en 17:20 UTC) voor prijs + beschikbaarheid.
    # Op :20 om niet met de andere leveranciersfeeds tegelijk te lopen.
    - cron: "20 5,17 * * *"
  workflow_dispatch:

# De bot moet de bijgewerkte XML kunnen terugpushen naar de repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Python instellen
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencies installeren
        run: pip install -r requirements.txt
      - name: Tests draaien
        run: python test_feed.py
      - name: Scraper draaien
        run: python scraper.py
      - name: XML committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alka_feed.xml alka_staffelkortingen.csv
          git diff --staged --quiet || git commit -m "🔄 Feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
