name: Alka ADD-feed Updater

# De ADD-feed bevat álle productinfo (beschrijving, gebruik, ingrediënten,
# afbeeldingen, varianten) om met Stock Sync NIEUWE producten aan te maken.
# Draait 1x per week — Alka brengt zelden iets nieuws uit.

on:
  schedule:
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies installeren
        run: pip install -r requirements.txt
      - name: Tests draaien
        run: python test_feed.py
      - name: ADD-feed scraper draaien
        run: python add_scraper.py
      - name: XML committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alka_add_feed.xml alka_tekstbron.csv
          git diff --staged --quiet || git commit -m "🆕 ADD-feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
